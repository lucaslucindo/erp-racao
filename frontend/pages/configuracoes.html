<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>ERP Ração - Configurações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Navbar -->
  <div id="navbar"></div>

  <!-- Conteúdo principal -->
  <div class="container mt-4">
    <h2>Configurações do Sistema</h2>
    <p>Ajuste suas preferências e informações em um só lugar.</p>

    <div class="row">
      <!-- Perfil do usuário -->
      <div class="col-md-6">
        <div class="card mb-3">
          <div class="card-header bg-dark text-white">Perfil</div>
          <div class="card-body">
            <p><strong>Nome:</strong> <span id="configUserName"></span></p>
            <p><strong>Email:</strong> <span id="configUserEmail"></span></p>
            <button class="btn btn-primary">Editar Perfil</button>
          </div>
        </div>
      </div>

      <!-- Preferências -->
      <div class="col-md-6">
        <div class="card mb-3">
          <div class="card-header bg-dark text-white">Preferências</div>
          <div class="card-body">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="darkMode">
              <label class="form-check-label" for="darkMode">Ativar modo escuro</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="notifications">
              <label class="form-check-label" for="notifications">Receber notificações</label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Segurança -->
    <div class="card mt-3">
      <div class="card-header bg-dark text-white">Segurança</div>
      <div class="card-body">
        <button class="btn btn-warning">Alterar Senha</button>
        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#logoutModal">Encerrar Sessão</button>
      </div>
    </div>
  </div>

  <!-- Modal de Logout -->
  <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title" id="logoutModalLabel">Encerrar Sessão</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Tem certeza que deseja sair?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="confirmLogoutBtn">Sair</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>  
  <script>
    // Carrega a navbar
    fetch('../pages/navbar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('navbar').innerHTML = html;
      });

    // Exibe dados do usuário
    document.addEventListener('DOMContentLoaded', () => {
      const userName = localStorage.getItem('userName');
      const userEmail = localStorage.getItem('userEmail'); // supondo que você salve isso no login
      if (userName) document.getElementById('configUserName').textContent = userName;
      if (userEmail) document.getElementById('configUserEmail').textContent = userEmail;
    });
  </script>  
</body>
</html>
